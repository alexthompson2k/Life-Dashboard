<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A personal life dashboard: finances, tasks, weather, news and fitness in one place." />
    <meta name="theme-color" content="#2a78d6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dashboard" />
    <title>Life Dashboard</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong surface.
      (function () {
        try {
          var stored = localStorage.getItem('ld.theme')
          var theme =
            stored && stored !== 'system'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Plaid Link. Loaded lazily and tolerated if absent: the Accounts tab
         reports a clear message rather than failing when it has not loaded. -->
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
